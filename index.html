<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Journal | Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #030202;
      background: radial-gradient(circle at center, #140905 0%, #050302 55%, #000000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* Ambient Viewfinder Corners */
    .viewfinder-corner {
      position: fixed;
      width: 34px;
      height: 34px;
      border: 1.5px solid rgba(255, 140, 40, 0.35);
      pointer-events: none;
      z-index: 8;
    }
    .top-left { top: 32px; left: 105px; border-right: none; border-bottom: none; }
    .top-right { top: 32px; right: 105px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 32px; left: 105px; border-right: none; border-top: none; }
    .bottom-right { bottom: 32px; right: 105px; border-left: none; border-top: none; }

    /* Editorial Typography */
    .site-header {
      position: fixed;
      top: 36px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 9px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      z-index: 15;
      pointer-events: none;
      animation: fadeInText 1.5s 2.4s ease forwards;
      opacity: 0;
    }

    .site-footer {
      position: fixed;
      bottom: 34px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(255, 160, 60, 0.65);
      z-index: 15;
      pointer-events: none;
      animation: fadeInText 1.5s 2.6s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    /* Ambient Dust Canvas */
    #dustCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 4;
      opacity: 0.95;
    }

    .portal-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      z-index: 20;
    }

    /* Split Film Strips (85px visible width) */
    .film-strip-half {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 85px; 
      height: 100vh;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      animation: fadeInHalf 1.2s 2.6s ease-out forwards;
    }

    .film-left { left: 0; }
    .film-right { right: 0; }

    .film-track {
      position: absolute;
      top: 0;
      width: 170px;
      height: 300%;
      background-repeat: repeat-y;
      background-size: 170px 260px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="170" height="260" viewBox="0 0 170 260"><rect width="170" height="260" fill="%23050505"/><rect x="30" y="16" width="110" height="100" rx="4" fill="%23121212" stroke="%233a3a3a" stroke-width="2.5"/><rect x="30" y="146" width="110" height="100" rx="4" fill="%23121212" stroke="%233a3a3a" stroke-width="2.5"/><g fill="%23f0f0f0"><rect x="7" y="10" width="13" height="19" rx="3"/><rect x="7" y="42" width="13" height="19" rx="3"/><rect x="7" y="74" width="13" height="19" rx="3"/><rect x="7" y="106" width="13" height="19" rx="3"/><rect x="7" y="138" width="13" height="19" rx="3"/><rect x="7" y="170" width="13" height="19" rx="3"/><rect x="7" y="202" width="13" height="19" rx="3"/><rect x="7" y="234" width="13" height="19" rx="3"/><rect x="150" y="10" width="13" height="19" rx="3"/><rect x="150" y="42" width="13" height="19" rx="3"/><rect x="150" y="74" width="13" height="19" rx="3"/><rect x="150" y="106" width="13" height="19" rx="3"/><rect x="150" y="138" width="13" height="19" rx="3"/><rect x="150" y="170" width="13" height="19" rx="3"/><rect x="150" y="202" width="13" height="19" rx="3"/><rect x="150" y="234" width="13" height="19" rx="3"/></g><text x="8" y="164" fill="%239a9a9a" font-size="12" font-weight="bold" font-family="monospace">4</text><text x="148" y="36" fill="%239a9a9a" font-size="12" font-weight="bold" font-family="monospace">3A</text></svg>');
    }

    .film-left .film-track {
      left: -85px;
      animation: rollUp 18s 2.6s linear infinite;
    }

    .film-right .film-track {
      left: 0;
      animation: rollDown 18s 2.6s linear infinite;
    }

    @keyframes fadeInHalf {
      from { opacity: 0; }
      to { opacity: 0.75; }
    }

    @keyframes rollUp {
      from { transform: translateY(0); }
      to { transform: translateY(-520px); }
    }

    @keyframes rollDown {
      from { transform: translateY(-520px); }
      to { transform: translateY(0); }
    }

    /* Rotating Center Swirl */
    .logo-wrapper {
      position: absolute;
      width: 360px;
      height: 360px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 22;
      animation: 
        zoomSpinIntro 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        steadyRotation 14s 2.6s linear infinite;
    }

    .logo-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 24px rgba(242, 85, 36, 0.35));
    }

    @keyframes zoomSpinIntro {
      0% { transform: scale(6) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: scale(1) rotate(720deg); opacity: 1; }
    }

    @keyframes steadyRotation {
      from { transform: scale(1) rotate(720deg); }
      to { transform: scale(1) rotate(1080deg); }
    }

    /* Enter Button */
    .enter-btn {
      position: absolute;
      z-index: 25;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle, #200c04 0%, #050505 100%);
      border: 1.5px solid rgba(255, 145, 45, 0.75);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 0 30px rgba(255, 120, 0, 0.4);
      transition: all 0.3s ease;
      opacity: 0;
      transform: scale(0.85);
      animation: revealBtn 0.7s 2.6s ease forwards;
    }

    .enter-btn:hover {
      background: radial-gradient(circle, #381504 0%, #0a0a0a 100%);
      border-color: rgba(255, 190, 80, 1);
      box-shadow: 0 0 45px rgba(255, 140, 0, 0.8);
      transform: scale(0.98);
      letter-spacing: 3px;
    }

    @keyframes revealBtn {
      to { opacity: 1; transform: scale(1); }
    }

    /* 5 Planes Fleet Layer */
    .plane-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }

    .airplane-item {
      position: absolute;
      width: 26px;
      height: 26px;
      top: 0;
      left: 0;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 1.2s ease;
      filter: drop-shadow(0 0 8px rgba(255, 170, 50, 0.7));
    }

    .dash-trail {
      position: absolute;
      color: rgba(255, 255, 255, 0.85);
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: fadeDash 2.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes fadeDash {
      0% { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
      70% { opacity: 0.6; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.25); }
    }

    /* Meteor Crash & White Explosion */
    .meteor {
      position: fixed;
      width: 8px;
      height: 70px;
      border-radius: 4px;
      background: linear-gradient(to top, #ffffff, #ffaa33, transparent);
      box-shadow: 0 0 25px 5px #ff6600, 0 0 50px 10px #ffffff;
      z-index: 999;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      display: none;
    }

    @keyframes meteorFall {
      0% { top: -100px; transform: translateX(-50%) scale(0.8); }
      80% { top: 95vh; transform: translateX(-50%) scale(1.4); }
      100% { top: 102vh; transform: translateX(-50%) scale(2); }
    }

    .white-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-in;
    }
  </style>
</head>
<body>

  <div class="viewfinder-corner top-left"></div>
  <div class="viewfinder-corner top-right"></div>
  <div class="viewfinder-corner bottom-left"></div>
  <div class="viewfinder-corner bottom-right"></div>

  <div class="site-header">V I S U A L &nbsp; J O U R N A L</div>
  <div class="site-footer">M O M E N T S &nbsp;&bull;&nbsp; T H O U G H T S</div>

  <canvas id="dustCanvas"></canvas>

  <div class="film-strip-half film-left"><div class="film-track"></div></div>
  <div class="film-strip-half film-right"><div class="film-track"></div></div>

  <div class="plane-container" id="trailContainer">
    <svg id="airplane1" class="airplane-item" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="#ffb03a" stroke-width="1.8"/><path d="M22 2L15 22L11 13L2 9L22 2Z" fill="#ffffff" stroke="#ffb03a" stroke-width="1.2"/></svg>
    <svg id="airplane2" class="airplane-item" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="#ff9020" stroke-width="1.8"/><path d="M22 2L15 22L11 13L2 9L22 2Z" fill="#fff8f0" stroke="#ff9020" stroke-width="1.2"/></svg>
    <svg id="airplane3" class="airplane-item" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="#ffa533" stroke-width="1.8"/><path d="M22 2L15 22L11 13L2 9L22 2Z" fill="#ffffff" stroke="#ffa533" stroke-width="1.2"/></svg>
    <svg id="airplane4" class="airplane-item" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="#ffc04d" stroke-width="1.8"/><path d="M22 2L15 22L11 13L2 9L22 2Z" fill="#fffdfa" stroke="#ffc04d" stroke-width="1.2"/></svg>
    <svg id="airplane5" class="airplane-item" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="#ff7c24" stroke-width="1.8"/><path d="M22 2L15 22L11 13L2 9L22 2Z" fill="#ffffff" stroke="#ff7c24" stroke-width="1.2"/></svg>
  </div>

  <div class="portal-container">
    <div class="logo-wrapper">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="swirlGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb834" /><stop offset="45%" stop-color="#f25524" /><stop offset="85%" stop-color="#2a0845" /><stop offset="100%" stop-color="#140224" />
          </linearGradient>
          <linearGradient id="swirlGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffa02e" /><stop offset="50%" stop-color="#e63e15" /><stop offset="88%" stop-color="#240638" /><stop offset="100%" stop-color="#0f011a" />
          </linearGradient>
        </defs>
        <g transform="translate(200, 200)">
          <path d="M 0,-60 C 75,-135 155,-105 170,-42 C 185,22 125,85 60,0 Z" fill="url(#swirlGrad1)" transform="rotate(0)" />
          <path d="M 0,-60 C 75,-135 155,-105 170,-42 C 185,22 125,85 60,0 Z" fill="url(#swirlGrad2)" transform="rotate(60)" />
          <path d="M 0,-60 C 75,-135 155,-105 170,-42 C 185,22 125,85 60,0 Z" fill="url(#swirlGrad1)" transform="rotate(120)" />
          <path d="M 0,-60 C 75,-135 155,-105 170,-42 C 185,22 125,85 60,0 Z" fill="url(#swirlGrad2)" transform="rotate(180)" />
          <path d="M 0,-60 C 75,-135 155,-105 170,-42 C 185,22 125,85 60,0 Z" fill="url(#swirlGrad1)" transform="rotate(240)" />
          <path d="M 0,-60 C 75,-135 155,-105 170,-42 C 185,22 125,85 60,0 Z" fill="url(#swirlGrad2)" transform="rotate(300)" />
          <circle cx="0" cy="0" r="56" fill="#000000" />
        </g>
      </svg>
    </div>
    <a href="about.html" class="enter-btn" id="enterBtn">Enter</a>
  </div>

  <div class="meteor" id="meteor"></div>
  <div class="white-flash" id="whiteFlash"></div>

  <script>
    const btn = document.getElementById('enterBtn');
    const meteor = document.getElementById('meteor');
    const flash = document.getElementById('whiteFlash');

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      btn.style.opacity = '0';
      btn.style.pointerEvents = 'none';

      meteor.style.display = 'block';
      meteor.style.animation = 'meteorFall 0.75s cubic-bezier(0.6, 0.04, 0.98, 0.33) forwards';

      setTimeout(() => {
        flash.style.opacity = '1';
      }, 730);

      setTimeout(() => {
        window.location.href = 'about.html';
      }, 950);
    });

    // Dust particles
    const canvas = document.getElementById('dustCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 55; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.2 + 0.8,
        dx: (Math.random() - 0.5) * 0.35,
        dy: (Math.random() - 0.5) * 0.35,
        baseAlpha: Math.random() * 0.45 + 0.5,
        pulseSpeed: Math.random() * 0.02 + 0.01,
        pulseOffset: Math.random() * Math.PI
      });
    }

    let frame = 0;
    function renderDust() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;
      particles.forEach((p) => {
        const alpha = p.baseAlpha + Math.sin(frame * p.pulseSpeed + p.pulseOffset) * 0.15;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.shadowColor = 'rgba(255, 200, 120, 0.85)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = `rgba(255, 225, 175, ${Math.max(0.2, alpha)})`;
        ctx.fill();
        ctx.restore();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      });
      requestAnimationFrame(renderDust);
    }
    renderDust();

    // Airplanes
    const container = document.getElementById('trailContainer');
    const planes = [
      { el: document.getElementById('airplane1'), speed: 0.00040, phase: 0.0, scaleX: 1.0, scaleY: 0.85, freq: 2, prevX: 0, prevY: 0, lastDash: 0 },
      { el: document.getElementById('airplane2'), speed: 0.00032, phase: 1.3, scaleX: 0.88, scaleY: 1.1, freq: 3, prevX: 0, prevY: 0, lastDash: 0 },
      { el: document.getElementById('airplane3'), speed: 0.00046, phase: 2.6, scaleX: 0.95, scaleY: 0.75, freq: 1, prevX: 0, prevY: 0, lastDash: 0 },
      { el: document.getElementById('airplane4'), speed: 0.00036, phase: 3.8, scaleX: 0.80, scaleY: 0.95, freq: 2, prevX: 0, prevY: 0, lastDash: 0 },
      { el: document.getElementById('airplane5'), speed: 0.00042, phase: 5.1, scaleX: 1.05, scaleY: 0.70, freq: 1, prevX: 0, prevY: 0, lastDash: 0 }
    ];

    let startTimestamp = null;
    function getPlaneCoords(t, p) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cX = w / 2;
      const cY = h / 2;
      const maxRadiusX = (w / 2) - 140;
      const maxRadiusY = (h / 2) - 80;
      const angle = (t * p.speed) + p.phase;
      let x = cX + maxRadiusX * p.scaleX * Math.cos(angle);
      let y = cY + maxRadiusY * p.scaleY * Math.sin(p.freq * angle);
      const dx = x - cX;
      const dy = y - cY;
      const dist = Math.hypot(dx, dy);
      const minDistance = 110;
      if (dist < minDistance && dist > 0) {
        const factor = minDistance / dist;
        x = cX + dx * factor;
        y = cY + dy * factor;
      }
      return { x, y };
    }

    function renderPlanes(timestamp) {
      if (!startTimestamp) startTimestamp = timestamp;
      const elapsed = timestamp - startTimestamp;
      if (elapsed > 2800) {
        planes.forEach((p) => {
          p.el.style.opacity = '1';
          const pos = getPlaneCoords(elapsed, p);
          const deltaX = pos.x - p.prevX;
          const deltaY = pos.y - p.prevY;
          const angle = (Math.atan2(deltaY, deltaX) * 180 / Math.PI);
          p.el.style.transform = `translate(${pos.x}px, ${pos.y}px) rotate(${angle + 45}deg)`;
          if (timestamp - p.lastDash > 55) {
            createDash(pos.x, pos.y, angle);
            p.lastDash = timestamp;
          }
          p.prevX = pos.x;
          p.prevY = pos.y;
        });
      }
      requestAnimationFrame(renderPlanes);
    }

    function createDash(x, y, angle) {
      const dash = document.createElement('span');
      dash.className = 'dash-trail';
      dash.textContent = '-';
      const offset = 18;
      const rad = angle * Math.PI / 180;
      const tailX = x - Math.cos(rad) * offset;
      const tailY = y - Math.sin(rad) * offset;
      dash.style.left = `${tailX}px`;
      dash.style.top = `${tailY}px`;
      dash.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
      container.appendChild(dash);
      setTimeout(() => dash.remove(), 2800);
    }
    requestAnimationFrame(renderPlanes);
  </script>
</body>
</html>
